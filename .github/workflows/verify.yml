name: Verify Repository

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-unix:
    name: Validate Scripts, Hooks, MCP & JSON (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Bash script syntax (.sh)
        run: |
          for script in install.sh update.sh verify.sh uninstall.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done

      - name: Check Python MCP server syntax
        run: |
          python -m py_compile mcp/central_memory_mcp.py

      - name: Check Node.js guardrail hook syntax (.mjs)
        run: |
          node --check plugins/antigravity-sdlc/hooks/sdlc-guardrails.mjs

      - name: Validate JSON files
        run: |
          python - << 'EOF'
          import json, pathlib, sys

          json_files = [
              "mcp_config.example.json",
              "plugins/antigravity-sdlc/hooks.json",
              "plugins/antigravity-sdlc/plugin.json",
              "plugins/rtk/hooks.json",
              "plugins/rtk/plugin.json",
          ]

          errors = 0
          for path_str in json_files:
              p = pathlib.Path(path_str)
              if not p.exists():
                  print(f"[FAIL] Missing file: {path_str}")
                  errors += 1
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
                  print(f"[OK] Valid JSON: {path_str}")
              except json.JSONDecodeError as e:
                  print(f"[FAIL] Invalid JSON in {path_str}: {e}")
                  errors += 1

          sys.exit(errors)
          EOF

      - name: Verify core repository structure
        run: |
          test -f README.md
          test -f LICENSE
          test -d agents && [ "$(ls -1 agents/*.md | wc -l)" -ge 1 ]
          test -f memory/GLOBAL_RULES.md
          test -f memory/ARCHITECTURE_NOTES.md
          echo "[OK] Core structure verified."

      # Uncomment if verify.sh supports running cleanly in a headless CI environment:
      # - name: Run verify.sh
      #   run: |
      #     chmod +x verify.sh
      #     ./verify.sh

  validate-windows:
    name: Validate PowerShell Scripts (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PowerShell script syntax (.ps1)
        shell: pwsh
        run: |
          $scripts = @(
            "install.ps1",
            "update.ps1",
            "verify.ps1",
            "uninstall.ps1",
            "scripts/qdrant-tunnel.ps1",
            "scripts/verify-gate.ps1"
          )

          $hasErrors = $false
          foreach ($file in $scripts) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing script: $file"
              $hasErrors = $true
              continue
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              Write-Host "[FAIL] Syntax errors in $file" -ForegroundColor Red
              $parseErrors | ForEach-Object { Write-Host "  Line $($_.Extent.StartLineNumber): $($_.Message)" }
              $hasErrors = $true
            } else {
              Write-Host "[OK] Valid PowerShell syntax: $file" -ForegroundColor Green
            }
          }

          if ($hasErrors) { exit 1 }

      # Uncomment if verify.ps1 supports running cleanly in a headless CI environment:
      # - name: Run verify.ps1
      #   shell: pwsh
      #   run: .\verify.ps1