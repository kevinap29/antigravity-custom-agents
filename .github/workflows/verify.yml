name: Verify Repository

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-unix:
    name: Validate Scripts, Hooks, MCP & E2E (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Bash script syntax (.sh)
        run: |
          for script in install.sh update.sh verify.sh uninstall.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done

      - name: Check Python MCP server syntax
        run: |
          python -m py_compile mcp/central_memory_mcp.py

      - name: Check Node.js hooks and gate script syntax (.mjs)
        run: |
          node --check plugins/antigravity-sdlc/hooks/sdlc-guardrails.mjs
          node --check plugins/antigravity-sdlc/scripts/verify-gate.mjs

      - name: Run Node.js unit tests (guardrails & verify-gate)
        run: |
          node --test tests/sdlc-guardrails.test.mjs tests/verify-gate.test.mjs

      - name: Run Python MCP & rule-drift unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate JSON files
        run: |
          python - << 'EOF'
          import json, pathlib, sys

          json_files = [
              "mcp_config.example.json",
              "plugins/antigravity-sdlc/hooks.json",
              "plugins/antigravity-sdlc/plugin.json",
              "plugins/rtk/hooks.json",
              "plugins/rtk/plugin.json",
          ]

          errors = 0
          for path_str in json_files:
              p = pathlib.Path(path_str)
              if not p.exists():
                  print(f"[FAIL] Missing file: {path_str}")
                  errors += 1
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
                  print(f"[OK] Valid JSON: {path_str}")
              except json.JSONDecodeError as e:
                  print(f"[FAIL] Invalid JSON in {path_str}: {e}")
                  errors += 1

          sys.exit(errors)
          EOF

      - name: Verify core repository structure
        run: |
          test -f README.md
          test -f LICENSE
          test -d agents && [ "$(ls -1 agents/*.md | wc -l)" -ge 1 ]
          test -f memory/GLOBAL_RULES.md
          test -f memory/ARCHITECTURE_NOTES.md
          test -f templates/GEMINI.md
          test ! -e GEMINI.md
          test -f plugins/antigravity-sdlc/scripts/verify-gate.mjs
          test -f plugins/antigravity-sdlc/scripts/verify-gate.ps1
          echo "[OK] Core structure verified."

      - name: Run headless E2E installer/verifier/uninstaller (Unix)
        run: |
          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_home"' EXIT
          export ANTIGRAVITY_HOME="$tmp_home"
          bash install.sh --non-interactive --gemini-mode=overwrite
          bash verify.sh
          bash uninstall.sh

  validate-windows:
    name: Validate PowerShell Scripts & E2E (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check PowerShell script syntax (.ps1)
        shell: pwsh
        run: |
          $scripts = @(
            "install.ps1",
            "update.ps1",
            "verify.ps1",
            "uninstall.ps1",
            "scripts/qdrant-tunnel.ps1",
            "plugins/antigravity-sdlc/scripts/verify-gate.ps1"
          )

          $hasErrors = $false
          foreach ($file in $scripts) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing script: $file"
              $hasErrors = $true
              continue
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              Write-Host "[FAIL] Syntax errors in $file" -ForegroundColor Red
              $parseErrors | ForEach-Object { Write-Host "  Line $($_.Extent.StartLineNumber): $($_.Message)" }
              $hasErrors = $true
            } else {
              Write-Host "[OK] Valid PowerShell syntax: $file" -ForegroundColor Green
            }
          }

          if ($hasErrors) { exit 1 }

      - name: Run Node.js unit tests (guardrails & verify-gate)
        shell: pwsh
        run: node --test tests/sdlc-guardrails.test.mjs tests/verify-gate.test.mjs

      - name: Run Python MCP & rule-drift unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run headless E2E installer/verifier/uninstaller (Windows)
        shell: pwsh
        run: |
          $tmpHome = Join-Path ([System.IO.Path]::GetTempPath()) "ag-ci-e2e-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $tmpHome -Force | Out-Null
          $env:ANTIGRAVITY_HOME = $tmpHome
          try {
            .\install.ps1 -NonInteractive -GeminiMdMode Overwrite
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed with exit code $LASTEXITCODE" }
            .\verify.ps1
            if ($LASTEXITCODE -ne 0) { throw "verify.ps1 failed with exit code $LASTEXITCODE" }
            .\uninstall.ps1
            if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item -LiteralPath $tmpHome -Recurse -Force -ErrorAction SilentlyContinue
          }
